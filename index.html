<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asistente de Voz - Correo IA</title>
    <!-- Vinculamos el archivo de estilos -->
    <link rel="stylesheet" href="estilos.css">
    <!-- Iconos de FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

    <!-- Contenedor principal de la barra flotante -->
    <div id="widget-container" class="widget-bar">
        
        <!-- Estado normal: Mini rectángulo -->
        <div id="bar-content" class="bar-content">
            <div class="brand-section">
                <div class="avatar-mini">
                    <i class="fa-solid fa-robot"></i>
                </div>
                <span id="status-text" class="status-text">Listo para escuchar...</span>
            </div>

            <div class="controls-section">
                <!-- Botón de prueba rápida con tu ejemplo -->
                <button id="btn-demo" class="icon-btn demo-btn" title="Simular frase de ejemplo">
                    <i class="fa-solid fa-wand-magic-sparkles"></i>
                </button>
                <!-- Botón principal de Voz -->
                <button id="btn-mic" class="icon-btn mic-btn" title="Iniciar/Detener voz">
                    <i class="fa-solid fa-microphone"></i>
                </button>
                <!-- Botón minimizar -->
                <button id="btn-minimize" class="icon-btn" title="Minimizar barra">
                    <i class="fa-solid fa-chevron-left"></i>
                </button>
            </div>
        </div>

        <!-- Estado minimizado (Pestaña pequeña) -->
        <div id="minimized-tab" class="minimized-tab hidden" title="Abrir asistente">
            <i class="fa-solid fa-microphone"></i>
        </div>

        <!-- Panel desplegable con la vista previa del correo generado por IA -->
        <div id="preview-card" class="preview-card hidden">
            <div class="preview-header">
                <h3><i class="fa-solid fa-envelope-circle-check"></i> Correo redactado por IA</h3>
                <button id="btn-close-preview" class="close-icon"><i class="fa-solid fa-xmark"></i></button>
            </div>
            
            <div class="preview-body">
                <div class="input-group">
                    <label>Para:</label>
                    <input type="text" id="input-to" readonly>
                </div>
                <div class="input-group">
                    <label>Copia (CC):</label>
                    <input type="text" id="input-cc" readonly>
                </div>
                <div class="input-group">
                    <label>Asunto:</label>
                    <input type="text" id="input-subject" readonly>
                </div>
                <div class="input-group">
                    <label>Mensaje:</label>
                    <textarea id="input-message" rows="3" readonly></textarea>
                </div>
            </div>

            <div class="preview-footer">
                <button id="btn-cancel" class="btn secondary">Descartar</button>
                <button id="btn-send" class="btn primary"><i class="fa-solid fa-paper-plane"></i> Enviar Correo</button>
            </div>
        </div>

    </div>

    <!-- Notificación Toast flotante -->
    <div id="toast" class="toast hidden">Correo enviado con éxito</div>

    <!-- Vinculamos el archivo de JavaScript -->
    <script src="app.js"></script>
</body>
</html>
